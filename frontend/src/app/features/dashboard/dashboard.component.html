<div class="dashboard-page">
  <div class="dashboard-card">
    <div class="check-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>Bonjour !</h1>

    @if (user()) {
      <p class="welcome-msg">
        Bienvenue, <strong>{{ user().email }}</strong>
      </p>
      <div class="role-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        {{ user().role }}
      </div>
    }

    <p class="sub-text">Vous êtes maintenant connecté à la plateforme E-INS.</p>

    <button class="btn-logout" (click)="logout()" id="logout-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Se déconnecter
    </button>
  </div>
</div>
