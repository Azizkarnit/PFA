<div class="auth-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="glass-card auth-card shadow-lg p-5">
    <div class="text-center mb-4">
      <div class="logo-circle mx-auto mb-3">
        <i class="bi bi-shield-lock text-white fs-3"></i>
      </div>
      <h2 class="fw-bold brand-primary mb-1">INS Portal</h2>
      <p class="text-secondary small">Statistical Survey Management</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2 small rounded-3" role="alert">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="form-label small fw-medium text-secondary">Email Address</label>
        <div class="input-group custom-input-group">
          <span class="input-group-text bg-white border-end-0 text-muted">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control border-start-0 ps-0" formControlName="email" placeholder="agent@ins.nat.tn" required>
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label small fw-medium text-secondary mb-0">Password</label>
          <a routerLink="/auth/forgot-password" class="small text-decoration-none accent-link">Forgot password?</a>
        </div>
        <div class="input-group custom-input-group">
          <span class="input-group-text bg-white border-end-0 text-muted">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control border-start-0 ps-0" formControlName="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-medium btn-brand" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Authenticating...' : 'Sign In' }}
      </button>
    </form>
    
    <div class="mt-4 text-center">
      <p class="small text-muted mb-0">
        By signing in, you agree to the <a href="#" class="accent-link text-decoration-none">Terms of Service</a> & <a href="#" class="accent-link text-decoration-none">Privacy Policy</a>
      </p>
    </div>
  </div>
</div>
