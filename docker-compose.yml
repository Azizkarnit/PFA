version: '3.8'

services:
  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: pfa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pfa_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Pub/Sub & Task Queue) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pfa_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend API ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfa_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/pfa_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cd8f4bcd6ca80dd7dbd02b5c47095d8e1b8c16a6adc24aee1a738bb420f8bc65}
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Background Worker ───────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfa_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker -P threads -c 4 --loglevel=info
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/pfa_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cd8f4bcd6ca80dd7dbd02b5c47095d8e1b8c16a6adc24aee1a738bb420f8bc65}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Angular Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pfa_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
